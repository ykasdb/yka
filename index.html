  <script>
    let currentUser = JSON.parse(localStorage.getItem('rda_current_user') || 'null');
    let posts = [];
    let currentFilter = 'all';
    let currentSort = 'new';
    let searchQuery = '';
    
    let selectedThumbBase64 = null;
    let selectedFileBase64 = null;
    let selectedFileName = '';
    let selectedFileSize = 0;
    let activeViewPostId = null;

    function initFirebaseSync() {
      const { collection, onSnapshot } = window.firebaseFns;
      
      onSnapshot(collection(window.db, 'posts'), (snapshot) => {
        posts = [];
        snapshot.forEach((doc) => {
          posts.push({ id: doc.id, ...doc.data() });
        });
        renderPosts();
        if (activeViewPostId) {
          const currentPost = posts.find(p => p.id === activeViewPostId);
          if (currentPost) renderViewPostModal(currentPost);
        }
      });
    }

    async function getDBUsers() {
      const { collection, getDocs } = window.firebaseFns;
      try {
        const snapshot = await getDocs(collection(window.db, 'users'));
        let list = [];
        snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
        return list;
      } catch (e) {
        return [];
      }
    }

    async function saveDBUser(user) {
      const { doc, setDoc } = window.firebaseFns;
      try {
        await setDoc(doc(window.db, 'users', user.id), user);
        return true;
      } catch (e) {
        return false;
      }
    }

    async function saveDBPost(post) {
      const { doc, setDoc } = window.firebaseFns;
      try {
        await setDoc(doc(window.db, 'posts', post.id), post);
        return true;
      } catch (e) {
        return false;
      }
    }

    async function deleteDBPost(id) {
      const { doc, deleteDoc } = window.firebaseFns;
      try {
        await deleteDoc(doc(window.db, 'posts', id));
        return true;
      } catch (e) {
        return false;
      }
    }

    function showToast(msg) {
      const formatted = msg.toLowerCase().replace(/[.!?]/g, '');
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'pointer-events-auto bg-dark-700 border border-dark-400 text-white font-mono text-xs px-3.5 py-2.5 rounded-lg shadow-2xl transition duration-300 opacity-0 transform translate-y-2';
      toast.textContent = formatted;
      container.appendChild(toast);
      
      setTimeout(() => toast.classList.remove('opacity-0', 'translate-y-2'), 10);
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 2600);
    }

    function formatSize(bytes) {
      if (!bytes) return '0 B';
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1048576).toFixed(1) + ' MB';
    }

    function formatDate(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      return d.toLocaleDateString('pt-BR');
    }

    function escapeHTML(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function fileToBase64(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => resolve(null);
        reader.readAsDataURL(file);
      });
    }

    function updateAuthUI() {

    function getFilteredPosts() {
      let res = [...posts];

      if (searchQuery.trim()) {
        const q = searchQuery.toLowerCase().trim();
        res = res.filter(p => 
          (p.title && p.title.toLowerCase().includes(q)) ||
          (p.description && p.description.toLowerCase().includes(q)) ||
          (p.content && p.content.toLowerCase().includes(q)) ||
          (p.authorName && p.authorName.toLowerCase().includes(q)) ||
          (p.fileName && p.fileName.toLowerCase().includes(q))
        );
      }

      if (currentFilter !== 'all') {
        res = res.filter(p => {
          const hasText = !!p.content;
          const hasFile = !!p.fileName;
          if (currentFilter === 'text') return hasText && !hasFile;
          if (currentFilter === 'file') return hasFile && !hasText;
          if (currentFilter === 'both') return hasText && hasFile;
          return true;
        });
      }

      res.sort((a, b) => {
        if (currentSort === 'new') return b.createdAt - a.createdAt;
        if (currentSort === 'old') return a.createdAt - b.createdAt;
        if (currentSort === 'az') return a.title.localeCompare(b.title);
        if (currentSort === 'votes') {
          const scoreA = Object.values(a.votes || {}).reduce((acc, v) => acc + v, 0);
          const scoreB = Object.values(b.votes || {}).reduce((acc, v) => acc + v, 0);
          return scoreB - scoreA;
        }
        return 0;
      });

      return res;
    }

    async function handleVote(postId, val) {
      if (!currentUser) {
        currentUser = { id: 'guest_' + Math.random().toString(36).substring(2, 9), name: 'visitante', isGuest: true };
        localStorage.setItem('rda_current_user', JSON.stringify(currentUser));
        updateAuthUI();
      }

      const post = posts.find(p => p.id === postId);
      if (!post) return;

      if (!post.votes) post.votes = {};
      const current = post.votes[currentUser.id] || 0;

      if (current === val) {
        delete post.votes[currentUser.id];
      } else {
        post.votes[currentUser.id] = val;
      }

      await saveDBPost(post);
      renderPosts();
      if (activeViewPostId === postId) renderViewPostModal(post);
    }

              <div>
                <label class="block font-mono text-[10px] text-slate-400 uppercase mb-1">foto de perfil</label>
                <label for="edit-avatar-input" class="flex items-center gap-3 bg-dark-900 border border-dark-400 rounded-lg p-2.5 cursor-pointer hover:border-dark-300 transition">
                  <span class="btn-action-dark font-mono text-xs px-3 py-1.5 rounded shrink-0 pointer-events-none">Escolher foto</span>
                  <span id="avatar-filename-label" class="font-mono text-xs text-slate-400 truncate">
                    ${userObj.avatarUrl ? 'foto de perfil atual selecionada' : 'nenhum arquivo escolhido'}
                  </span>
                  <input type="file" id="edit-avatar-input" accept="image/*" class="hidden">
                </label>
              </div>

              <div>
                <label class="block font-mono text-[10px] text-slate-400 uppercase mb-1">biografia / sobre você</label>
                <textarea id="edit-bio-input" rows="2" maxlength="200" placeholder="escreva algo sobre você..." class="w-full p-2.5 text-xs input-custom resize-none">${escapeHTML(userObj.bio || '')}</textarea>
              </div>

              <button id="btn-save-profile" class="btn-action-dark font-mono text-xs py-2.5 px-4 rounded-lg w-full">
                salvar perfil
              </button>
            </div>
          </div>
        ` : ''}

        <div class="space-y-3 pt-2">
          <h3 class="font-mono text-xs font-bold text-white uppercase tracking-wider">publicações de ${escapeHTML(userObj.name)} (${userPosts.length})</h3>
          
          <div class="space-y-2 max-h-60 overflow-y-auto pr-1">
            ${userPosts.length === 0 ? `
              <p class="font-mono text-xs text-slate-500 text-center py-4">nenhuma publicação criada por este usuário.</p>
            ` : userPosts.map(p => `
              <div class="bg-dark-800 border border-dark-500/70 rounded-lg p-3 flex items-center justify-between cursor-pointer hover:border-dark-400 transition btn-profile-post" data-id="${p.id}">
                <div>
                  <h4 class="font-bold text-xs text-white">${escapeHTML(p.title)}</h4>
                  <span class="font-mono text-[10px] text-slate-400">${formatDate(p.createdAt)}</span>
                </div>
                <span class="font-mono text-[10px] text-slate-400">abrir ➔</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;

      if (isMe) {
        const fileInp = document.getElementById('edit-avatar-input');
        fileInp.addEventListener('change', (e) => {
          const file = e.target.files[0];
          if (file) {
            document.getElementById('avatar-filename-label').textContent = file.name;
          }
        });

        document.getElementById('btn-save-profile').onclick = async () => {
          const bioInp = document.getElementById('edit-bio-input');
          
          let newAvatar = userObj.avatarUrl || '';
          if (fileInp.files[0]) {
            newAvatar = await fileToBase64(fileInp.files[0]);
          }

          userObj.bio = bioInp.value.trim();
          userObj.avatarUrl = newAvatar;

          await saveDBUser(userObj);
          currentUser = { ...currentUser, bio: userObj.bio, avatarUrl: userObj.avatarUrl };
          localStorage.setItem('rda_current_user', JSON.stringify(currentUser));
          
          updateAuthUI();
          openProfileModal(userId);
          showToast('perfil atualizado com sucesso');
        };
      }

      document.querySelectorAll('.btn-profile-post').forEach(b => {
        b.onclick = () => {
          const post = posts.find(x => x.id === b.dataset.id);
          if (post) {
            closeModals();
            openViewPostModal(post);
          }
        };
      });

      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    window.addEventListener('firebase-ready', async () => {
      initFirebaseSync();
      updateAuthUI();

      document.getElementById('post-thumb-file').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (file) {
          selectedThumbBase64 = await fileToBase64(file);
          document.getElementById('thumb-filename-label').textContent = file.name;
          document.getElementById('thumb-preview-img').src = selectedThumbBase64;
          document.getElementById('thumb-preview-box').classList.remove('hidden');
        }
      });

      document.getElementById('post-attachment-file').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (file) {
          selectedFileBase64 = await fileToBase64(file);
          selectedFileName = file.name;
          selectedFileSize = file.size;
          document.getElementById('attachment-name-label').textContent = `${file.name} · ${formatSize(file.size)}`;
        }
      });

      document.getElementById('form-publish').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        if (!currentUser) {
          currentUser = { id: 'guest_' + Math.random().toString(36).substring(2, 9), name: 'visitante', avatarUrl: '', isGuest: true };
          localStorage.setItem('rda_current_user', JSON.stringify(currentUser));
          updateAuthUI();
        }

        const title = document.getElementById('post-title').value.trim();
        const description = document.getElementById('post-desc').value.trim();
        const content = document.getElementById('post-content').value.trim();

        if (!title) return;
        if (!content && !selectedFileBase64) {
          showToast('adicione um texto ou selecione um arquivo');
          return;
        }

        const newPost = {
          id: 'post_' + Math.random().toString(36).substring(2, 11),
          title,
          description,
          content,
          thumbUrl: selectedThumbBase64 || '',
          fileName: selectedFileName || '',
          fileSize: selectedFileSize || 0,
          fileData: selectedFileBase64 || '',
          authorId: currentUser.id,
          authorName: currentUser.name || 'visitante',
          authorAvatar: currentUser.avatarUrl || '',
          votes: {},
          comments: [],
          createdAt: Date.now()
        };

        await saveDBPost(newPost);
        e.target.reset();
        selectedThumbBase64 = null;
        selectedFileBase64 = null;
        selectedFileName = '';
        selectedFileSize = 0;
        document.getElementById('thumb-preview-box').classList.add('hidden');
        document.getElementById('thumb-filename-label').textContent = 'nenhum arquivo escolhido';
        document.getElementById('attachment-name-label').textContent = 'nenhum arquivo escolhido';
        closeModals();
        showToast('publicação adicionada ao yka');
      });

      document.getElementById('tab-login-btn').onclick = () => switchAuthTab('login');
      document.getElementById('tab-register-btn').onclick = () => switchAuthTab('register');

      document.getElementById('form-login').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim().toLowerCase();
        const password = document.getElementById('login-password').value;

        const users = await getDBUsers();
        const userFound = users.find(u => u.email === email);

        if (!userFound) {
          showToast('nenhuma conta encontrada com este e-mail');
          return;
        }

        if (userFound.password !== password) {
          showToast('senha incorreta');
          return;
        }

        currentUser = { id: userFound.id, name: userFound.name, email: userFound.email, bio: userFound.bio || '', avatarUrl: userFound.avatarUrl || '', isGuest: false };
        localStorage.setItem('rda_current_user', JSON.stringify(currentUser));
        updateAuthUI();
        closeModals();
        document.getElementById('form-login').reset();
        showToast(`bem-vindo de volta ${userFound.name}`);
      });

      document.getElementById('form-register').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('reg-name').value.trim();
        const email = document.getElementById('reg-email').value.trim().toLowerCase();
        const password = document.getElementById('reg-password').value;

        const users = await getDBUsers();

        const emailExists = users.some(u => u.email === email);
        if (emailExists) {
          showToast('este e-mail já está em uso');
          return;
        }

        const newUser = {
          id: 'usr_' + Math.random().toString(36).substring(2, 11),
          name: name,
          email: email,
          password: password,
          bio: '',
          avatarUrl: '',
          createdAt: Date.now()
        };

        await saveDBUser(newUser);

        currentUser = { id: newUser.id, name: newUser.name, email: newUser.email, bio: '', avatarUrl: '', isGuest: false };
        localStorage.setItem('rda_current_user', JSON.stringify(currentUser));
        updateAuthUI();
        closeModals();
        document.getElementById('form-register').reset();
        showToast('conta criada com sucesso');
      });

      document.getElementById('btn-guest-login').onclick = () => {
        currentUser = { id: 'guest_' + Math.random().toString(36).substring(2, 9), name: 'visitante', bio: '', avatarUrl: '', isGuest: true };
        localStorage.setItem('rda_current_user', JSON.stringify(currentUser));
        updateAuthUI();
        closeModals();
        showToast('modo visitante ativo');
      };

      document.getElementById('search-input').addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderPosts();
      });

      document.querySelectorAll('#filter-chips .chip-btn').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('#filter-chips .chip-btn').forEach(b => {
            b.classList.remove('active', 'bg-dark-600', 'text-white', 'font-bold');
            b.classList.add('bg-dark-800', 'text-slate-400');
          });
          btn.classList.add('active', 'bg-dark-600', 'text-white', 'font-bold');
          btn.classList.remove('text-slate-400', 'bg-dark-800');
          currentFilter = btn.dataset.filter;
          renderPosts();
        };
      });

      document.getElementById('sort-select').addEventListener('change', (e) => {
        currentSort = e.target.value;
        renderPosts();
      });

      document.getElementById('btn-open-create').onclick = () => {
        document.getElementById('modal-create').classList.remove('hidden');
        document.getElementById('modal-create').classList.add('flex');
      };

      document.querySelectorAll('.modal-close').forEach(b => b.onclick = closeModals);
      document.querySelectorAll('#modal-create, #modal-view, #modal-auth, #modal-profile').forEach(m => {
        m.onclick = (e) => { if (e.target === m) closeModals(); };
      });
    });
  </script>
</body>
</html>
